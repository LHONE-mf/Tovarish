name: Diagnose private artifact quota
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quota-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current artifact usage and latest draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{visibility,private}'
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --slurp | jq '[.[].artifacts[] | select(.expired == false)] | {count:length,bytes:([.[].size_in_bytes]|add // 0)}'
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft) | .assets[] | select(.name=="Tovarish-Test-debug.apk") | {name,size,created_at}] | sort_by(.created_at) | reverse | .[:3]'
          printf 'quota probe\n' > quota-probe.txt
      - uses: actions/upload-artifact@v4
        id: probe
        continue-on-error: true
        with:
          name: quota-probe-${{ github.run_id }}
          path: quota-probe.txt
          retention-days: 1
      - name: Report and remove probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          ARTIFACT_ID: ${{ steps.probe.outputs.artifact-id }}
        run: |
          echo "Tiny artifact upload: $PROBE_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$ARTIFACT_ID" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          fi
          test "$PROBE_OUTCOME" = success
