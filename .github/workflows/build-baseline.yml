name: Build Tovarish baseline APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/geniex-baseline')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qualcomm/ai-hub-apps
          ref: e6477cfa238acaffe01ed45de4cfcbd53abbc99d
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.3.13750724'
      - name: Rename launcher label
        working-directory: upstream/geniex_chat_android
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/res/values/strings.xml')
          s = p.read_text()
          old = '<string name="app_name">GenieXDemo</string>'
          assert s.count(old) == 1, 'Unexpected upstream app label'
          p.write_text(s.replace(old, '<string name="app_name">Tovarish</string>'))
          PY
      - name: Add download diagnostics to isolated test app
        working-directory: upstream/geniex_chat_android
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(p, old, new):
              s = p.read_text()
              assert s.count(old) == 1, f'Unexpected upstream source: {p}'
              p.write_text(s.replace(old, new))
          p = Path('src/main/java/com/geniex/demo/MainActivity.kt')
          replace(p, '        tvDownloadProgress.text = "0%"\n\n        val hub =', '''        tvDownloadProgress.text = "Connecting to model server…"
                  pbDownloading.isIndeterminate = true
                  val meter = DownloadMeter()

                  val hub ='''.replace('\n                  ', '\n        '))
          old = '''                                val total = event.files.sumOf { if (it.total_bytes > 0) it.total_bytes else 0L }
                                          val done = event.files.sumOf { it.downloaded_bytes }
                                          val percent = if (total > 0) ((done * 100) / total).toInt() else 0
                                          runOnUiThread { tvDownloadProgress.text = "$percent%" }'''
          # Match indentation exactly from pinned upstream.
          old = '\n'.join([old.splitlines()[0]] + ['                                '+line.strip() for line in old.splitlines()[1:]])
          new = '''                                val done = event.files.sumOf { it.downloaded_bytes.coerceAtLeast(0L) }
                                          val known = event.files.isNotEmpty() && event.files.all { it.total_bytes > 0L }
                                          val total = if (known) event.files.sumOf { it.total_bytes } else null
                                          val progress = meter.update(done, total, android.os.SystemClock.elapsedRealtime())
                                          runOnUiThread {
                                              tvDownloadProgress.text = progress.text
                                              pbDownloading.isIndeterminate = progress.percent == null
                                              progress.percent?.let { pbDownloading.progress = it }
                                          }'''
          new = '\n'.join([new.splitlines()[0]] + [line[10:] for line in new.splitlines()[1:]])
          replace(p, old, new)
          replace(p, '"Download failed. Please check your network connection and try again.",', '"Download failed (code \u0024{event.code}). Retry or check the network and free storage.",')
          replace(p, '                    }\n                } finally {\n                    if (wakeLock.isHeld) wakeLock.release()', '''                    }
                          } catch (e: kotlinx.coroutines.CancellationException) {
                              throw e
                          } catch (e: Exception) {
                              Log.e(TAG, "Model download failed", e)
                              runOnUiThread {
                                  llDownloading.visibility = View.GONE
                                  Toast.makeText(this@MainActivity, "Download failed: \u0024{e.javaClass.simpleName}", Toast.LENGTH_LONG).show()
                              }
                          } finally {
                              if (wakeLock.isHeld) wakeLock.release()'''.replace('\n          ', '\n'))
          replace(Path('build.gradle'), "applicationId 'com.geniex.demo'", "applicationId 'com.geniex.demo.tovarish.test'")
          replace(Path('build.gradle'), "    // Testing (instrumented UI Automator tests under src/androidTest)", "    testImplementation 'junit:junit:4.13.2'\n\n    // Testing (instrumented UI Automator tests under src/androidTest)")
          replace(Path('src/main/res/values/strings.xml'), '<string name="app_name">Tovarish</string>', '<string name="app_name">Tovarish Test</string>')
          layout = Path('src/main/res/layout/activity_main.xml')
          replace(layout, 'android:id="@+id/pb_downloading"\n', 'android:id="@+id/pb_downloading"\n            style="?android:attr/progressBarStyleHorizontal"\n            android:max="100"\n            android:indeterminate="true"\n')
          replace(layout, 'android:id="@+id/tv_download_progress"\n            android:layout_width="wrap_content"\n            android:layout_height="wrap_content"\n            android:text="0%"', 'android:id="@+id/tv_download_progress"\n            android:layout_width="match_parent"\n            android:layout_height="wrap_content"\n            android:gravity="center"\n            android:padding="16dp"\n            android:text="Connecting…"')
          p.with_name('DownloadMeter.kt').write_text('''package com.geniex.demo

          import java.util.Locale

          internal class DownloadMeter {
              data class State(val text: String, val percent: Int?)
              private var lastBytes: Long? = null
              private var lastTime = 0L
              private var rate: Double? = null

              fun update(done: Long, total: Long?, now: Long): State {
                  val previous = lastBytes
                  if (previous == null || done < previous || now < lastTime) {
                      lastBytes = done
                      lastTime = now
                      rate = null
                  } else if (now - lastTime >= 500L) {
                      val sample = (done - previous) * 1000.0 / (now - lastTime)
                      rate = rate?.let { 0.6 * it + 0.4 * sample } ?: sample
                      lastBytes = done
                      lastTime = now
                  }
                  val validTotal = total?.takeIf { it > 0 && it >= done }
                  val fraction = validTotal?.let { done.toDouble() / it }
                  val percent = fraction?.let { (it * 100).toInt().coerceIn(0, 100) }
                  val speed = rate?.let { fmt(it / 1e6) + " MB/s" } ?: "measuring…"
                  val amount = if (validTotal != null) "\u0024{fmt(done / 1e6)} / \u0024{fmt(validTotal / 1e6)} MB" else "\u0024{fmt(done / 1e6)} MB (total unknown)"
                  val eta = if (validTotal != null && rate != null && rate!! > 0.0) {
                      val seconds = ((validTotal - done) / rate!!).toLong().coerceAtLeast(0)
                      "\u0024{seconds / 60}m \u0024{seconds % 60}s remaining"
                  } else "ETA unavailable"
                  val header = fraction?.let { fmt(it * 100) + "%" } ?: "Downloading…"
                  return State(listOf(header, amount, speed, eta).joinToString("\\n"), percent)
              }

              private fun fmt(value: Double) = String.format(Locale.US, "%.1f", value)
          }
          ''' )
          t = Path('src/test/java/com/geniex/demo/DownloadMeterTest.kt')
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text('''package com.geniex.demo

          import org.junit.Assert.*
          import org.junit.Test

          class DownloadMeterTest {
              @Test fun unknownTotalNeverShowsZeroPercent() {
                  val m = DownloadMeter()
                  m.update(0, null, 0)
                  val s = m.update(2000000, null, 1000)
                  assertNull(s.percent)
                  assertTrue(s.text.contains("2.0 MB (total unknown)"))
                  assertTrue(s.text.contains("2.0 MB/s"))
                  assertTrue(s.text.contains("ETA unavailable"))
              }

              @Test fun knownTotalShowsFractionAndEta() {
                  val m = DownloadMeter()
                  m.update(0, 10000000, 0)
                  val s = m.update(2000000, 10000000, 1000)
                  assertEquals(20, s.percent)
                  assertTrue(s.text.contains("20.0%"))
                  assertTrue(s.text.contains("0m 4s remaining"))
              }

              @Test fun changingOrInvalidCountersDoNotFakeProgress() {
                  val m = DownloadMeter()
                  m.update(5000000, 10000000, 1000)
                  val s = m.update(1000000, 500000, 2000)
                  assertNull(s.percent)
                  assertTrue(s.text.contains("measuring"))
              }
          }
          ''')
          PY
      - name: Show app traffic even when SDK callbacks stall
        working-directory: upstream/geniex_chat_android
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/geniex/demo/MainActivity.kt')
          s = p.read_text()
          def replace(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          replace('val meter = DownloadMeter()', '''val meter = DownloadMeter()
                  val startedAt = android.os.SystemClock.elapsedRealtime()
                  val initialRx = android.net.TrafficStats.getUidRxBytes(android.os.Process.myUid())
                  var sdkText = "Waiting for SDK progress…"
                  var lastCallbackAt = startedAt''')
          replace('ModelManagerWrapper.pullFlow(input).collect { event ->', '''val monitor = launch(Dispatchers.Main) {
                          var previousRx = initialRx
                          var previousAt = startedAt
                          while (true) {
                              val now = android.os.SystemClock.elapsedRealtime()
                              val rx = android.net.TrafficStats.getUidRxBytes(android.os.Process.myUid())
                              val elapsedMs = now - previousAt
                              val traffic = if (initialRx >= 0 && rx >= initialRx) String.format(Locale.US, "%.1f MB app traffic", (rx - initialRx) / 1e6) else "App traffic unavailable"
                              val speed = if (previousRx >= 0 && rx >= previousRx && elapsedMs > 0) String.format(Locale.US, "%.2f MB/s", (rx - previousRx) / 1000.0 / elapsedMs) else "Measuring…"
                              val elapsed = (now - startedAt) / 1000
                              val age = (now - lastCallbackAt) / 1000
                              tvDownloadProgress.text = sdkText + "\\n" + traffic + " · " + speed + "\\nElapsed: " + elapsed + "s · SDK update: " + age + "s ago"
                              previousRx = rx
                              previousAt = now
                              kotlinx.coroutines.delay(1000)
                          }
                      }
                      try {
                          ModelManagerWrapper.pullFlow(input).collect { event ->''')
          replace('tvDownloadProgress.text = progress.text', '''sdkText = progress.text
                                              lastCallbackAt = android.os.SystemClock.elapsedRealtime()''')
          marker = '} catch (e: kotlinx.coroutines.CancellationException) {'
          replace(marker, '''} finally {
                          monitor.cancel()
                      }
                  } catch (e: kotlinx.coroutines.CancellationException) {''')
          p.write_text(s)
          PY
      - name: Add model inventory and serialized download retry
        working-directory: upstream/geniex_chat_android
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/geniex/demo/MainActivity.kt')
          s = p.read_text()
          def replace(old, new, count=1):
              global s
              assert s.count(old) == count, old
              s = s.replace(old, new)
          replace('private var downloadJob: Job? = null', '''private var downloadJob: Job? = null
              private var changingDownload = false
              private var managingModels = false''')
          replace('if (downloadJob?.isActive == true) {', 'if (changingDownload || downloadJob?.isCompleted == false) {', 2)
          replace('private fun downloadModel(selectModelData: ModelData) {', '''private fun downloadModel(selectModelData: ModelData) {
                  if (managingModels || llLoading.visibility == View.VISIBLE) return''')
          replace("        binding.btnCancelDownload.setOnClickListener {\n            downloadJob?.cancel()\n            downloadJob = null\n            tvDownloadProgress.text = \"0%\"\n            binding.llDownloading.visibility = View.GONE\n        }\n        binding.btnRetryDownload.setOnClickListener {\n            downloadJob?.cancel()\n            downloadJob = null\n            downloadingModelData?.let { downloadModel(it) }\n        }", "        binding.btnCancelDownload.setOnClickListener { finishDownload(false) }\n        binding.btnRetryDownload.setOnClickListener { finishDownload(true) }\n        binding.btnManageModels.setOnClickListener { showModelInventory() }")
          replace('btnLoadModel.setOnClickListener {\n', '''btnLoadModel.setOnClickListener {
                      if (managingModels || changingDownload || downloadJob?.isCompleted == false) {
                          Toast.makeText(this@MainActivity, "Finish or pause the current download first.", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
          '''.replace('\n          ', '\n'))
          replace('    private fun setListeners() {', '''    private fun finishDownload(retry: Boolean) {
                  if (changingDownload) return
                  changingDownload = true
                  binding.btnCancelDownload.isEnabled = false
                  binding.btnRetryDownload.isEnabled = false
                  val previous = downloadJob
                  val model = downloadingModelData
                  tvDownloadProgress.text = "Stopping download safely…"
                  modelScope.launch(Dispatchers.Main) {
                      try {
                          previous?.cancel()
                          previous?.join()
                          downloadJob = null
                          changingDownload = false
                          if (retry && model != null) {
                              downloadModel(model)
                          } else {
                              llDownloading.visibility = View.GONE
                              Toast.makeText(this@MainActivity, "Download paused. Use Download to continue.", Toast.LENGTH_LONG).show()
                          }
                      } finally {
                          changingDownload = false
                          binding.btnCancelDownload.isEnabled = true
                          binding.btnRetryDownload.isEnabled = true
                      }
                  }
              }

              private fun showModelInventory() {
                  if (managingModels || changingDownload || downloadJob?.isCompleted == false || hasLoadedModel() || isGenerating || llLoading.visibility == View.VISIBLE) {
                      Toast.makeText(this, "Pause downloads and unload the model first.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  managingModels = true
                  val button = binding.btnManageModels
                  button.isEnabled = false
                  modelScope.launch(Dispatchers.Main) {
                      try {
                          val installed = kotlinx.coroutines.withContext(Dispatchers.IO) {
                              modelList.filter { ModelManagerWrapper.getPaths(it.modelName) != null }
                                  .distinctBy { it.modelName }
                          }
                          val free = android.os.StatFs(filesDir.absolutePath).availableBytes / 1e9
                          val title = String.format(Locale.US, "Installed models · %.1f GB free", free)
                          if (isFinishing || isDestroyed) {
                              managingModels = false
                              button.isEnabled = true
                              return@launch
                          }
                          val dialog = AlertDialog.Builder(this@MainActivity).setTitle(title)
                          if (installed.isEmpty()) {
                              dialog.setMessage("No complete catalog models downloaded.")
                          } else {
                              dialog.setItems(installed.map { it.displayName }.toTypedArray()) { _, index ->
                                  val selected = installed[index]
                                  AlertDialog.Builder(this@MainActivity)
                                      .setTitle("Remove model?")
                                      .setMessage(selected.displayName + "\\nOnly this downloaded model will be removed. You can download it again.")
                                      .setNegativeButton("Keep", null)
                                      .setPositiveButton("Remove") { _, _ ->
                                          if (managingModels || changingDownload || downloadJob?.isCompleted == false || hasLoadedModel() || isGenerating || llLoading.visibility == View.VISIBLE) {
                                              Toast.makeText(this@MainActivity, "Model is busy.", Toast.LENGTH_SHORT).show()
                                              return@setPositiveButton
                                          }
                                          managingModels = true
                                          button.isEnabled = false
                                          modelScope.launch(Dispatchers.Main) {
                                              try {
                                                  val rc = ModelManagerWrapper.remove(selected.modelName)
                                                  Toast.makeText(this@MainActivity, if (rc == 0) "Model removed" else "Remove failed: " + rc, Toast.LENGTH_LONG).show()
                                              } catch (e: Exception) {
                                                  Toast.makeText(this@MainActivity, "Remove failed: " + e.javaClass.simpleName, Toast.LENGTH_LONG).show()
                                              } finally {
                                                  managingModels = false
                                                  button.isEnabled = true
                                              }
                                          }
                                      }
                                      .show()
                              }
                          }
                          dialog.setNegativeButton("Close", null).setOnDismissListener {
                              managingModels = false
                              button.isEnabled = true
                          }.show()
                      } catch (e: Exception) {
                          managingModels = false
                          button.isEnabled = true
                          Toast.makeText(this@MainActivity, "Model list unavailable", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun setListeners() {'''.replace('\n          ', '\n'))
          p.write_text(s)
          layout = Path('src/main/res/layout/activity_main.xml')
          xml = layout.read_text()
          marker = '        <!-- Control buttons section -->'
          assert xml.count(marker) == 1
          xml = xml.replace(marker, '''        <Button
                      android:id="@+id/btn_manage_models"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:layout_marginStart="16dp"
                      android:layout_marginEnd="16dp"
                      android:text="Installed models / Storage"
                      android:textAllCaps="false" />

          '''.replace('\n          ', '\n') + marker)
          xml = xml.replace('android:text="cancel"', 'android:text="Pause"').replace('android:text="retry"', 'android:text="Retry"')
          layout.write_text(xml)
          PY
      - name: Apply Tovarish AMOLED dark theme
        working-directory: upstream/geniex_chat_android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          root = Path('src/main')
          res = root / 'res'
          def edit(p, old, new):
              s = p.read_text()
              assert old in s, f'Missing anchor: {p}: {old}'
              p.write_text(s.replace(old, new))
          colors = res / 'values/colors.xml'
          edit(colors, '<color name="bg_normal">#F6F7F9</color>', '<color name="bg_normal">#000000</color>')
          edit(colors, '<color name="font_black">#1F1F1F</color>', '<color name="font_black">#F2F2F3</color>')
          edit(colors, '</resources>', '''    <color name="tovarish_surface">#151518</color>
              <color name="tovarish_accent">#8AB4FF</color>
              <color name="tovarish_secondary">#B8B8C0</color>
          </resources>''')
          theme = res / 'values/themes.xml'
          edit(theme, '</resources>', '''    <style name="Theme.Tovarish" parent="Theme.MaterialComponents.NoActionBar">
                  <item name="android:windowBackground">@color/bg_normal</item>
                  <item name="android:colorBackground">@color/bg_normal</item>
                  <item name="colorSurface">@color/tovarish_surface</item>
                  <item name="colorOnSurface">@color/font_black</item>
                  <item name="colorPrimary">@color/tovarish_accent</item>
                  <item name="colorPrimaryVariant">@color/tovarish_accent</item>
                  <item name="colorOnPrimary">@color/black</item>
                  <item name="colorSecondary">@color/tovarish_accent</item>
                  <item name="colorOnSecondary">@color/black</item>
                  <item name="android:textColorPrimary">@color/font_black</item>
                  <item name="android:textColorSecondary">@color/tovarish_secondary</item>
                  <item name="android:textColorLink">@color/tovarish_accent</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/black</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:forceDarkAllowed">false</item>
              </style>
          </resources>''')
          edit(root / 'AndroidManifest.xml', '@style/Theme.MaterialComponents.Light.NoActionBar', '@style/Theme.Tovarish')
          edit(theme, 'Theme.Design.Light.BottomSheetDialog', 'Theme.Design.BottomSheetDialog')
          for name in ('MainActivity.kt', 'activity/FileContentActivity.kt'):
              p = root / 'java/com/geniex/demo' / name
              edit(p, 'statusBarColorInt(Color.WHITE)', 'statusBarColorInt(Color.BLACK)')
              edit(p, 'statusBarDarkFont(true)', 'statusBarDarkFont(false)')
          # Recolor layout UI attributes, without changing image assets or launcher art.
          palette = {'#1F1F1F':'#F2F2F3', '#888888':'#B8B8C0', '#ADADAD':'#A6A6AF', '#E7E7E7':'#303036', '#FFFFFF':'#151518', '#FFFFFFFF':'#FF151518', '#F6F7F9':'#000000'}
          for p in res.glob('layout*/*.xml'):
              def recolor(m):
                  attr, value = m.groups()
                  if value == '@color/white' and attr == 'background':
                      value = '@color/tovarish_surface'
                  elif value.upper() in palette:
                      value = palette[value.upper()]
                  return 'android:'+attr+'="'+value+'"'
              p.write_text(re.sub(r'android:(textColor|textColorHint|background)="([^"]+)"', recolor, p.read_text()))
          edit(res/'drawable/btn_rounded_border.xml', '#FFFFFFFF', '#FF151518')
          edit(res/'drawable/bg_input_box_background.xml', '#ffffff', '#151518')
          edit(res/'drawable/bg_user_message.xml', '#DBEAEB', '#202D40')
          # Basic resource validation before invoking Android's resource compiler.
          for p in [colors, theme, root/'AndroidManifest.xml', *res.glob('layout*/*.xml')]:
              ET.parse(p)
          PY
      - name: Stabilize download status layout
        working-directory: upstream/geniex_chat_android
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('src/main/res/layout/activity_main.xml')
          s = p.read_text()
          marker = 'android:id="@+id/tv_download_progress"'
          assert s.count(marker) == 1
          s = s.replace(marker, marker + '\n            android:minLines="6"')
          p.write_text(s)
          ET.parse(p)
          kotlin = Path('src/main/java/com/geniex/demo/MainActivity.kt').read_text()
          assert 'tvDownloadProgress.text = sdkText + ' in kotlin
          assert 'tvDownloadProgress.text = sdkText\n' not in kotlin
          PY
      - name: Build debug APK
        working-directory: upstream/geniex_chat_android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Package test artifact and provenance
        run: |
          mkdir -p out
          cp upstream/geniex_chat_android/build/outputs/apk/debug/app-debug.apk out/Tovarish-Test-debug.apk
          cp upstream/LICENSE out/QUALCOMM-LICENSE.txt
          git -C upstream rev-parse HEAD > out/upstream-commit.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging out/Tovarish-Test-debug.apk > out/apk-info.txt
          grep -F "application-label:'Tovarish Test'" out/apk-info.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs out/Tovarish-Test-debug.apk
          (cd out && sha256sum Tovarish-Test-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        id: artifact
        continue-on-error: true
        with:
          name: Tovarish-download-diagnostics
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save private draft release if artifact upload fails
        if: steps.artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          tag="baseline-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --draft --target "$HEAD_SHA" --title "Tovarish private baseline test" --notes "Unpublished test build. APK signature verified; see SHA256SUMS.txt. No device validation yet."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,url > /tmp/tovarish-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/tovarish-release.json').read_text())
          assert r['isDraft'], 'Expected an unpublished draft'
          assert {p.name for p in Path('out').iterdir()} <= {a['name'] for a in r['assets']}
          print(r['url'])
          PY
          echo "Private draft download: $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
