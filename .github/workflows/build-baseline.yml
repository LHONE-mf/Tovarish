                      android:text="Context tokens: " />
                  <Spinner
                      android:id="@+id/sp_context"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content" />
              </LinearLayout>

          ''' + marker))
          p = Path('build.gradle')
          x = p.read_text()
          assert x.count('versionCode 1') == 1
          p.write_text(x.replace('versionCode 1', 'versionCode 2').replace("versionName '1.0'", "versionName '1.1-dev'"))
