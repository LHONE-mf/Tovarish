      - name: Route text inference through a private worker process
        working-directory: upstream/geniex_chat_android
        run: |
          cp ../../tovarish/android-overrides/TextInferenceService.kt src/main/java/com/geniex/demo/
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/geniex/demo/MainActivity.kt')
          s = p.read_text()
          def replace(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          replace('private lateinit var llmWrapper: LlmWrapper', '''private val textInference by lazy {
                  TextInferenceClient(this) {
                      if (!isDestroyed && !isFinishing) {
                          resetLoadState()
                          isGenerating = false
                          removeLoadingIndicator()
                          vTip.visibility = View.GONE
                          llLoading.visibility = View.GONE
                          btnUnloadModel.visibility = View.GONE
                          btnStop.visibility = View.GONE
                          btnAddImage.visibility = View.INVISIBLE
                          requestedBackend = "Inference worker disconnected"
                          messages.add(Message("Inference worker stopped. No automatic restart.", MessageType.PROFILE))
                          reloadRecycleView()
                          refreshSendButtonState()
                      }
                  }
              }''')
          start = s.index('                    LlmWrapper\n')
          end = s.index('\n                "multimodal", "vlm" ->', start)
          s = s[:start] + '''                    try {
                              val request = Bundle().apply {
                                  putString("model", selectModelData.modelName)
                                  putString("runtime", pluginId)
                                  putString("device", resolvedDeviceId ?: ComputeUnitValue.NPU.value)
                                  putInt("context", contextTokens)
                                  putInt("layers", nGpuLayers)
                                  putBoolean("thinking", enableThinking)
                              }
                              textInference.call(InferenceProtocol.LOAD, request) { result ->
                                  if (result.getString("kind") == "loaded") {
                                      requestedBackend += " | " + result.getString("text").orEmpty()
                                  }
                              }
                              if (isNativeNpu) loadPrefs.edit().remove("pending_id").remove("pending").commit()
                              isLoadLlmModel = true
                              onLoadModelSuccess("Text model loaded in inference worker")
                          } catch (e: Exception) {
                              kotlinx.coroutines.withContext(Dispatchers.Main) { textInference.close() }
                              onLoadModelFailed(e.message ?: "Inference worker load failed")
                          }
                      }

          '''.rstrip() + '\n' + s[end:]
          # The local text configuration is now constructed exclusively by the worker.
          start = s.index('                    val isQairt = pluginId == "qairt"')
          end = s.index('                    try {', start)
          s = s[:start] + s[end:]
          start = s.index('                        chatList.add(ChatMessage(role = "user", inputString))')
          end = s.index('\n                    }\n\n                    clearImages()', start)
          s = s[:start] + '''                        try {
                                  textInference.call(InferenceProtocol.GENERATE, Bundle().apply {
                                      putString("prompt", inputString)
                                      putBoolean("thinking", enableThinking)
                                  }) { result ->
                                      when (result.getString("kind")) {
                                          "token" -> {
                                              removeLoadingIndicator()
                                              sb.append(result.getString("text").orEmpty())
                                              val msg = Message(sb.toString(), MessageType.ASSISTANT)
                                              if (messages.lastOrNull()?.type == MessageType.ASSISTANT)
                                                  messages[messages.lastIndex] = msg
                                              else messages.add(msg)
                                              adapter.notifyDataSetChanged()
                                          }
                                          "profile" -> {
                                              messages.add(Message(result.getString("text").orEmpty(), MessageType.PROFILE))
                                              reloadRecycleView()
                                          }
                                      }
                                  }
                              } catch (e: Exception) {
                                  runOnUiThread {
                                      removeLoadingIndicator()
                                      messages.add(Message("Inference: " + (e.message ?: "failed"), MessageType.PROFILE))
                                      reloadRecycleView()
                                  }
                              }''' + s[end:]
          replace('''                    llmWrapper.stopStream()
                              llmWrapper.destroy()
                              chatList.clear()
                              handleUnloadResult(0)'''.replace('\n          ', '\n'), '''                    try {
                                  textInference.call(InferenceProtocol.UNLOAD)
                                  handleUnloadResult(0)
                              } catch (e: Exception) {
                                  kotlinx.coroutines.withContext(Dispatchers.Main) { textInference.close() }
                                  handleUnloadResult(-1)
                              }''')
          replace('                    llmWrapper.stopStream()', '''                    try { textInference.call(InferenceProtocol.STOP) }
                              catch (e: Exception) { runOnUiThread { Toast.makeText(this@MainActivity, "Stop failed", Toast.LENGTH_SHORT).show() } }''')
          replace('                llmWrapper.reset()', '''                try { textInference.call(InferenceProtocol.RESET) }
                          catch (e: Exception) {
                              kotlinx.coroutines.withContext(Dispatchers.Main) { textInference.close() }
                              onLoadModelFailed("History reset failed; reload model")
                          } finally {
                              isGenerating = false
                              refreshSendButtonState()
                          }''')
          replace('    private fun clearHistory() {\n', '    private fun clearHistory() {\n        if (isGenerating || llLoading.visibility == View.VISIBLE) return\n        if (isLoadLlmModel) { isGenerating = true; refreshSendButtonState() }\n')
          replace('        btnUnloadModel.setOnClickListener {\n', '        btnUnloadModel.setOnClickListener {\n            if (isGenerating) {\n                Toast.makeText(this, "Stop generation before unloading.", Toast.LENGTH_SHORT).show()\n                return@setOnClickListener\n            }\n')
          replace('    override fun onDestroy() {', '    override fun onDestroy() {\n        textInference.close()')
          assert 'llmWrapper.' not in s, 'Local LLM call remained'
          p.write_text(s)
          p = Path('src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '        <activity\n            android:name=".MainActivity"'
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, '''        <service
                      android:name=".TextInferenceService"
                      android:process=":inference"
                      android:exported="false" />
          ''' + marker))
          p = Path('build.gradle')
          s = p.read_text()
          assert s.count('versionCode 2') == 1
          p.write_text(s.replace('versionCode 2', 'versionCode 3').replace("versionName '1.1-dev'", "versionName '1.2-dev'"))
          PY
      - name: Build debug APK
        working-directory: upstream/geniex_chat_android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Package test artifact and provenance
        run: |
          set -euo pipefail
          mkdir -p out
          # This public development key is deliberately NOT a production signing key.
          # The development package must never share an ID or certificate with production.
          umask 077
          keyfile="$(mktemp "$RUNNER_TEMP/tovarish-signing.XXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          base64 --decode tovarish/.github/keys/tovarish-public-development.p12.b64 > "$keyfile"
          EXPECTED=f6bac2653b36a419baa0fe5ab3fd5526bb958dd8ee8332c1ec0fe7ae1d0602bc
          ACTUAL=$(keytool -exportcert -keystore "$keyfile" -storetype PKCS12 -alias tovarish-dev-public -storepass android | sha256sum | cut -d' ' -f1)
          test "$ACTUAL" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$keyfile" --ks-type PKCS12 --ks-key-alias tovarish-dev-public --ks-pass pass:android --key-pass pass:android --out out/Tovarish-Test-debug.apk upstream/geniex_chat_android/build/outputs/apk/debug/app-debug.apk
          ACTUAL=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs out/Tovarish-Test-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL" = "$EXPECTED"
          rm -f out/*.idsig
          cp upstream/LICENSE out/QUALCOMM-LICENSE.txt
          git -C upstream rev-parse HEAD > out/upstream-commit.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging out/Tovarish-Test-debug.apk > out/apk-info.txt
          grep -F "application-label:'Tovarish Dev'" out/apk-info.txt
          grep -F "package: name='com.geniex.demo.tovarish.stabletest'" out/apk-info.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs out/Tovarish-Test-debug.apk
          (cd out && sha256sum Tovarish-Test-debug.apk > SHA256SUMS.txt)
          du -h out/*
          echo "APK bytes: $(stat -c %s out/Tovarish-Test-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: artifact
        continue-on-error: true
        with:
          name: Tovarish-download-diagnostics
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save private draft release if artifact upload fails
        if: steps.artifact.outcome == 'failure' && github.event.repository.private == true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          tag="baseline-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --draft --target "$HEAD_SHA" --title "Tovarish private baseline test" --notes "Unpublished test build. APK signature verified; see SHA256SUMS.txt. No device validation yet."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,url > /tmp/tovarish-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/tovarish-release.json').read_text())
          assert r['isDraft'], 'Expected an unpublished draft'
          assert {p.name for p in Path('out').iterdir()} <= {a['name'] for a in r['assets']}
          print(r['url'])
          PY
          echo "Private draft download: $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful artifact upload for public repository
        if: steps.artifact.outcome == 'failure' && github.event.repository.private == false
        run: |
          echo "::error::Public Actions artifact upload failed; inspect quota and upload logs."
          exit 1
      - name: Report artifact link
        if: steps.artifact.outcome == 'success'
        run: echo "APK artifact available in this workflow run." >> "$GITHUB_STEP_SUMMARY"
