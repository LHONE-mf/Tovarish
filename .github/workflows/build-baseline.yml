                      dialogBinding.llContext.visibility = if (isGgufLlmModel) View.VISIBLE else View.GONE
                      dialogBinding.spContext.adapter = android.widget.ArrayAdapter(
                          this, android.R.layout.simple_spinner_dropdown_item, contextOptions.map { it.toString() })
                      dialogBinding.spContext.setSelection(1)
                      supportPluginIds.forEach {''')
          replace('                                loadModel(selectModelData, modelDataPluginId, nGpuLayers, ggufLlmDeviceId)', '''                                val context = if (isGgufLlmModel) contextOptions[dialogBinding.spContext.selectedItemPosition.coerceIn(0, 2)] else 1024
                                          loadModel(selectModelData, modelDataPluginId, nGpuLayers, ggufLlmDeviceId, context)''')
          p.write_text(s)
          p = Path('src/main/res/layout/activity_main.xml')
          x = p.read_text()
          marker = '        <!-- Control buttons section -->'
          assert x.count(marker) == 1
          p.write_text(x.replace(marker, '''        <TextView
                      android:id="@+id/tv_engine_status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:textColor="#F2F2F3"
                      android:textSize="11sp" />

          ''' + marker))
          p = Path('src/main/res/layout/dialog_select_plugin_id.xml')
          x = p.read_text()
          marker = '    <LinearLayout\n        android:id="@+id/ll_gpu_layers"'
          assert x.count(marker) == 1
          p.write_text(x.replace(marker, '''    <LinearLayout
                  android:id="@+id/ll_context"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:visibility="gone">
                  <TextView
                      android:layout_width="wrap_content"
